openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Account operations
  - name: prayers
    description: Prayer operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /account:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Delete the signed-in user's account and app data
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        "200":
          description: Account and associated app data deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /prayers/generate:
    post:
      operationId: generatePrayer
      tags: [prayers]
      summary: Generate a prayer using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePrayerRequest"
      responses:
        "200":
          description: Generated prayer text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPrayer"
        "403":
          description: Free tier monthly limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FreeTierLimitReached"

  /prayers/submit:
    post:
      operationId: submitPrayer
      tags: [prayers]
      summary: Submit a prayer to the community collection
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCommunityPrayerRequest"
      responses:
        "201":
          description: Prayer submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPrayer"
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Premium subscription required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Submission limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /prayers/browse:
    get:
      operationId: getBrowsePrayers
      tags: [prayers]
      summary: Get community prayers
      parameters:
        - name: tradition
          in: query
          required: false
          schema:
            type: string
            enum: [All, Catholic, Christian, Universal, Jewish, Islamic, Secular]
            default: All
      responses:
        "200":
          description: List of community prayers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPrayerList"
    post:
      operationId: submitCommunityPrayer
      tags: [prayers]
      summary: Submit a prayer to the community collection (legacy — prefer /prayers/submit)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCommunityPrayerRequest"
      responses:
        "201":
          description: Prayer submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPrayer"
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Premium subscription required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Submission limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /prayers/{prayerId}/report:
    post:
      operationId: reportCommunityPrayer
      tags: [prayers]
      summary: Report a community prayer
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - name: prayerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCommunityPrayerRequest"
      responses:
        "200":
          description: Prayer report recorded, or the existing report was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPrayerReportResult"
        "400":
          description: Invalid prayer ID or report reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Prayer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /prayers/{prayerId}/block-author:
    post:
      operationId: blockCommunityPrayerAuthor
      tags: [prayers]
      summary: Block the author of a community prayer
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - name: prayerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Author blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPrayerBlockResult"
        "400":
          description: Prayer has no submitter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Prayer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /prayers/usage:
    get:
      operationId: getPrayerUsage
      tags: [prayers]
      summary: Get the current user's prayer generation usage for this month
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        "200":
          description: Monthly usage data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerUsage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /prayers/refresh-premium:
    post:
      operationId: refreshPrayerPremium
      tags: [prayers]
      summary: Refresh the signed-in user's premium status after a purchase or restore
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        "200":
          description: Refreshed premium status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshPremiumResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Clerk session JWT for native mobile requests. Web requests use cookies.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RefreshPremiumResult:
      type: object
      properties:
        isPremium:
          type: boolean
      required:
        - isPremium

    AccountDeletionResult:
      type: object
      properties:
        deleted:
          type: boolean
          const: true
      required:
        - deleted

    GeneratePrayerRequest:
      type: object
      properties:
        tradition:
          type: string
          enum: [Catholic, Christian, Universal, Jewish, Islamic, Secular]
        intentions:
          type: array
          items:
            type: string
        tone:
          type: string
        context:
          type: string
      required:
        - tradition
        - intentions
        - tone

    GeneratedPrayer:
      type: object
      properties:
        prayer:
          type: string
        isPremium:
          type: boolean
      required:
        - prayer
        - isPremium

    FreeTierLimitReached:
      type: object
      properties:
        error:
          type: string
        count:
          type: integer
        limit:
          type: integer
      required:
        - error
        - count
        - limit

    PrayerUsage:
      type: object
      properties:
        generationsThisMonth:
          type: integer
        limit:
          type: integer
        month:
          type: string
        isPremium:
          type: boolean
      required:
        - generationsThisMonth
        - limit
        - month
        - isPremium

    CommunityPrayer:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        tradition:
          type: string
        intention:
          type: string
        text:
          type: string
        isUserSubmitted:
          type: boolean
        status:
          type: string
          enum: [approved, pending, rejected]
        reportCount:
          type: integer
        hasSubmitter:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - title
        - tradition
        - intention
        - text
        - isUserSubmitted
        - status
        - reportCount
        - hasSubmitter
        - createdAt

    CommunityPrayerList:
      type: object
      properties:
        prayers:
          type: array
          items:
            $ref: "#/components/schemas/CommunityPrayerBrowseItem"
      required:
        - prayers

    CommunityPrayerBrowseItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        tradition:
          type: string
        intention:
          type: string
        text:
          type: string
        isUserSubmitted:
          type: boolean
        status:
          type: string
          enum: [approved, pending, rejected]
        hasSubmitter:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - title
        - tradition
        - intention
        - text
        - isUserSubmitted
        - status
        - hasSubmitter
        - createdAt

    SubmitCommunityPrayerRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        tradition:
          type: string
          enum: [Catholic, Christian, Universal, Jewish, Islamic, Secular]
        intention:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - title
        - tradition
        - intention
        - text

    ReportCommunityPrayerRequest:
      type: object
      properties:
        reason:
          type: string
          enum: [Offensive, Spam, Disrespectful to a faith, Other]
      required: [reason]

    CommunityPrayerReportResult:
      type: object
      properties:
        alreadyReported:
          type: boolean
        reportCount:
          type: integer
        status:
          type: string
          enum: [approved, pending, rejected]
      required: [alreadyReported, reportCount, status]

    CommunityPrayerBlockResult:
      type: object
      properties:
        blocked:
          type: boolean
      required: [blocked]

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
